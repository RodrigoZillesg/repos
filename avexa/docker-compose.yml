services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avexa
      POSTGRES_PASSWORD: avexa
      POSTGRES_DB: avexa
    ports: ['5432:5432']
    volumes: ['dados-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avexa']
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://avexa:avexa@postgres:5432/avexa
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  dados-pg:
