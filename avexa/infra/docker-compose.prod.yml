# Produção. Rodar sempre a partir de /opt/avexa/app:
#
#   docker compose --env-file .env -f infra/docker-compose.prod.yml up -d
#
# Diferenças que importam em relação ao compose de desenvolvimento:
#
#   - o Postgres NÃO publica porta. Na máquina de desenvolvimento 5432 aberta é
#     conveniência; num IP público é a base de leads de todo mundo exposta.
#   - o web também não publica porta: quem fala com a internet é o Caddy.
#   - senha de banco vem do .env, não é `avexa`.
name: avexa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: avexa
    volumes: ['dados-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avexa']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://avexa:${POSTGRES_PASSWORD}@postgres:5432/avexa
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://avexa:${POSTGRES_PASSWORD}@postgres:5432/avexa
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-dev@platty.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on: [web]
    restart: unless-stopped

volumes:
  dados-pg:
  caddy-dados:
  caddy-config:
