# Produção. Rodar sempre a partir de /opt/avexa-motor/app:
#
#   docker compose --env-file .env -f infra/docker-compose.prod.yml up -d
#
# Este arquivo não publica NADA na internet. O painel escuta só em 127.0.0.1,
# porque a máquina pode já estar servindo outras coisas e disputar a porta 80 é
# derrubar o que já está no ar. Quem quer que o Avexa cuide do próprio TLS
# acrescenta o docker-compose.caddy.yml por cima — o deploy faz isso sozinho
# quando PERFIL_PROXY=caddy.
#
# O nome do projeto isola tudo: contêineres, rede e volumes ficam com prefixo
# `avexa` e nada colide com outro projeto na mesma máquina.
name: avexa-motor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: avexa
    volumes: ['dados-pg:/var/lib/postgresql/data']
    networks: [interna]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avexa']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://avexa:${POSTGRES_PASSWORD}@postgres:5432/avexa
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
    # Loopback para a verificação do deploy a partir do host. Invisível da
    # internet.
    ports: ['127.0.0.1:${PORTA_WEB:-3001}:3000']
    networks:
      # A nossa rede, onde ficam banco e worker.
      interna:
      # E a do proxy que já existe na máquina, para ele falar com este contêiner
      # pelo nome. De dentro do contêiner do nginx, 127.0.0.1 é o próprio nginx
      # — apontar o proxy para a porta de loopback do host não funcionaria.
      nginx_public:
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://avexa:${POSTGRES_PASSWORD}@postgres:5432/avexa
      NODE_ENV: production
    networks: [interna]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

networks:
  interna:
  # Criada pelo projeto avexa-nginx, que já roda nesta máquina. `external`
  # significa: uso, não crio e não mexo. Se ela sumir, o nosso deploy falha em
  # vez de subir uma rede nova com o mesmo nome e confundir o proxy.
  nginx_public:
    external: true
    name: nginx_public

volumes:
  dados-pg:
