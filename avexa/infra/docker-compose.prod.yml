# Produção. Rodar sempre a partir de /opt/avexa/app:
#
#   docker compose --env-file .env -f infra/docker-compose.prod.yml up -d
#
# Este arquivo não publica NADA na internet. O painel escuta só em 127.0.0.1,
# porque a máquina pode já estar servindo outras coisas e disputar a porta 80 é
# derrubar o que já está no ar. Quem quer que o Avexa cuide do próprio TLS
# acrescenta o docker-compose.caddy.yml por cima — o deploy faz isso sozinho
# quando PERFIL_PROXY=caddy.
#
# O nome do projeto isola tudo: contêineres, rede e volumes ficam com prefixo
# `avexa` e nada colide com outro projeto na mesma máquina.
name: avexa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: avexa
    volumes: ['dados-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avexa']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://avexa:${POSTGRES_PASSWORD}@postgres:5432/avexa
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
    # Loopback, não 0.0.0.0: invisível da internet, e ainda assim alcançável
    # pelo proxy que já existe na máquina e pela verificação do deploy.
    ports: ['127.0.0.1:${PORTA_WEB:-3001}:3000']
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://avexa:${POSTGRES_PASSWORD}@postgres:5432/avexa
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  dados-pg:
