# Motor de outreach — new.avexa.global
#
# Este arquivo entra em /srv/avexa/nginx/conf.d/clients/, que o nginx já inclui
# por glob. Nenhum arquivo existente é editado: some este arquivo e a máquina
# volta exatamente ao que era.
#
# O proxy fala com o contêiner pelo nome, pela rede nginx_public — de dentro do
# contêiner do nginx, 127.0.0.1 é o próprio nginx, não o host.

upstream avexa_motor {
  server avexa-motor-web-1:3000;
}

server {
  listen 80;
  listen 8080;
  server_name new.avexa.global;

  # Precisa continuar acessível em HTTP puro ou a renovação do certificado
  # falha. Mesma raiz que os outros vhosts desta máquina usam.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Enquanto não há certificado, o painel responde por HTTP mesmo. Depois que o
  # certificado existir, este bloco vira redirecionamento e o tráfego real passa
  # para o bloco 443 abaixo.
  location / {
    proxy_pass http://avexa_motor;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 120s;
  }

  # Entrada de lead: a URL que o cliente cola no formulário dele é
  # new.avexa.global/v1/<cliente>/<fluxo>; a rota real é
  # /api/hooks/v1/<cliente>/<fluxo>. A barra no fim do proxy_pass é o que faz a
  # reescrita — sem ela, todo lead dá 404 e ninguém descobre até o primeiro
  # formulário disparar.
  location /v1/ {
    proxy_pass http://avexa_motor/api/hooks/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
