# Motor de outreach — new.avexa.global, depois que o certificado existir.
#
# Substitui o nginx-new.conf. A diferença: o bloco 80 passa a só redirecionar
# (menos a rota do ACME, que precisa continuar em HTTP puro para a renovação) e
# o tráfego real vai para o 443.

upstream avexa_motor {
  server avexa-motor-web-1:3000;
}

server {
  listen 80;
  listen 8080;
  server_name new.avexa.global;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name new.avexa.global;

  ssl_certificate     /etc/letsencrypt/live/new.avexa.global/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/new.avexa.global/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://avexa_motor;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 120s;
  }

  location /v1/ {
    proxy_pass http://avexa_motor/api/hooks/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
