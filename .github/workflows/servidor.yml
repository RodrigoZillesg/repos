name: Servidor

# As mãos remotas. Este container onde o Claude roda não alcança a porta 22 —
# o proxy do ambiente aceita o CONNECT e derruba tudo que não é TLS. O runner
# do GitHub alcança. Então é daqui que se olha e se mexe no VPS.
#
# Nada aqui precisa de terminal humano: cada ação sai no log do job.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que fazer no servidor'
        type: choice
        options: [diagnostico, bootstrap, logs, estado, nginx, publicar, certificado, publicar-tls, renovacao-automatica, renovar, backup-automatico, backup, segredos, fornecedores, testar-email, equipe, trocar-email, remover-usuario, acesso, limpar-verificacao]
        default: diagnostico
      usuario:
        description: 'Entrar como (root só para o bootstrap inicial)'
        type: choice
        options: [avexa, root]
        default: avexa
      servico:
        description: 'Para a ação "logs": web, worker ou postgres'
        type: string
        default: worker
      email:
        description: 'E-mail alvo (acesso, testar-email, trocar-email: o NOVO)'
        type: string
        default: rodrigo.zillesg@platty.tech
      email_atual:
        description: 'Para a ação "trocar-email": o endereço que está no banco hoje'
        type: string
        default: ''

concurrency:
  group: servidor
  cancel-in-progress: false

jobs:
  servidor:
    name: ${{ inputs.acao }}
    runs-on: ubuntu-latest
    environment: producao

    steps:
      - uses: actions/checkout@v4

      - name: Chave
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # keyscan falha por timeout de vez em quando (o servidor demora, o
          # sshd limita conexões simultâneas). Antes isso derrubava o passo
          # inteiro por causa do `bash -e`. Tenta algumas vezes; se não vier,
          # o accept-new faz a mesma confiança-no-primeiro-uso na hora de
          # conectar, que é exatamente o que o keyscan já fazia.
          for tentativa in 1 2 3; do
            if ssh-keyscan -T 10 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "identidade do servidor registrada"
              break
            fi
            echo "keyscan falhou (tentativa $tentativa)"
            sleep 5
          done
          # A pública sai da privada. Um segredo a menos para alguém cadastrar
          # à mão, e um a menos para circular por aí.
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub
          echo "chave pública derivada: $(cut -c1-40 ~/.ssh/id_deploy.pub)…"

      - name: Diagnóstico
        if: inputs.acao == 'diagnostico'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" \
            'bash -s' < avexa/infra/diagnostico.sh

      - name: Bootstrap
        if: inputs.acao == 'bootstrap'
        run: |
          if [ "${{ inputs.usuario }}" != "root" ]; then
            echo "::error::o bootstrap precisa de root — rode esta ação com usuario=root"
            exit 1
          fi
          # A chave passa como argumento: é a pública derivada acima, a mesma
          # que já abriu esta sessão. O script recusa qualquer coisa que pareça
          # chave privada.
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "root@${{ secrets.VPS_HOST }}" \
            "bash -s -- '$(cat ~/.ssh/id_deploy.pub)'" < avexa/infra/bootstrap.sh

      - name: Estado dos contêineres
        if: inputs.acao == 'estado'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTO'
          set -e
          cd /opt/avexa-motor/app 2>/dev/null || { echo "Avexa ainda não foi instalado nesta máquina."; exit 0; }
          docker compose --env-file .env -f infra/docker-compose.prod.yml ps
          echo
          echo "--- disco ---"; df -h / | tail -1
          echo "--- memória ---"; free -h | awk '/^Mem:/ {print $3 " de " $2}'
          REMOTO

      # Como o proxy que já existe nesta máquina é montado. Precisa ser lido
      # antes de qualquer tentativa de acrescentar um domínio: se a config vem
      # de um volume do host, dá para somar um arquivo sem editar os deles.
      - name: Como o nginx existente é montado
        if: inputs.acao == 'nginx'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTO'
          # Sem set -e: aqui é inspeção. Um ls que falha é informação, não motivo
          # para abortar e perder o resto do retrato.
          proxy=$(docker ps --format '{{.Names}}' | grep -Ei 'nginx|caddy|traefik' | head -1)
          echo "proxy: $proxy"
          echo
          echo "=== montagens (de onde vem a config) ==="
          docker inspect "$proxy" --format '{{range .Mounts}}{{.Source}} -> {{.Destination}} ({{.Mode}}){{"\n"}}{{end}}'
          echo "=== rede do proxy ==="
          docker inspect "$proxy" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
          echo
          echo "=== árvore de includes ==="
          docker exec "$proxy" sh -c 'grep -rn "include" /etc/nginx/nginx.conf | head -10'
          echo
          echo "=== arquivos de site ==="
          docker exec "$proxy" sh -c 'ls -la /etc/nginx/conf.d/ /etc/nginx/conf.d/clients/ 2>&1' || true
          echo
          echo "=== certificados que já existem ==="
          ls -1 /srv/avexa/nginx/certbot/conf/live/ 2>&1 || true
          echo
          echo "=== quem renova o TLS ==="
          docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' | grep -i certbot || echo "nenhum contêiner certbot"
          crontab -l 2>/dev/null | grep -i -E 'certbot|acme|renew' || echo "nada no crontab do root"
          ls -1 /etc/cron.d/ 2>/dev/null | head || true
          echo
          echo "=== como os outros se ligam ao proxy ==="
          docker network inspect nginx_public --format '{{range .Containers}}{{.Name}} {{end}}' 2>&1 || true
          grep -rn "nginx_public" /srv/avexa/*.yml /srv/avexa/**/*.yml 2>/dev/null | head -6 || true
          echo
          echo "=== um exemplo de server block deles ==="
          sed -n '1,40p' /srv/avexa/nginx/conf.d/routes.conf 2>&1 || true
          REMOTO

      # Põe o domínio no ar acrescentando UM arquivo em conf.d/clients/. Nenhum
      # arquivo do outro produto é editado. O reload só acontece se o nginx -t
      # passar: config inválida aqui derruba avexa.global e admin.avexa.global
      # junto, e isso não é risco que se corra por um domínio novo.
      - name: Publicar no nginx
        if: inputs.acao == 'publicar' || inputs.acao == 'publicar-tls'
        run: |
          arquivo=avexa/infra/nginx-new.conf
          [ "${{ inputs.acao }}" = "publicar-tls" ] && arquivo=avexa/infra/nginx-new-tls.conf
          echo "instalando $arquivo"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "$arquivo"             "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}:/tmp/new.conf"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTO'
          set -euo pipefail
          alvo=/srv/avexa/nginx/conf.d/clients/new.conf
          proxy=$(docker ps --format '{{.Names}}' | grep -Ei 'nginx' | head -1)

          # Guarda o que estava lá, se estava. Voltar atrás tem que ser uma
          # linha, não uma arqueologia.
          if [ -f "$alvo" ]; then
            cp -a "$alvo" "${alvo}.bak.$(date +%s)"
            echo "config anterior salva como ${alvo}.bak.*"
          fi

          install -m 644 /tmp/new.conf "$alvo"
          rm -f /tmp/new.conf

          echo "== nginx -t =="
          if ! docker exec "$proxy" nginx -t; then
            echo "::error::config inválida — removendo e NÃO recarregando"
            rm -f "$alvo"
            docker exec "$proxy" nginx -t
            exit 1
          fi

          echo "== reload =="
          docker exec "$proxy" nginx -s reload
          echo "vhost no ar. Os outros domínios continuam como estavam:"
          docker exec "$proxy" nginx -T 2>/dev/null | grep -E '^\s*server_name' | sort -u
          REMOTO

      # Emite o certificado pelo desafio de webroot, usando a mesma pasta que os
      # outros vhosts desta máquina já usam. Escreve só o diretório novo em
      # live/new.avexa.global — o certificado do admin.avexa.global não é
      # tocado. O certbot roda em contêiner descartável: nada é instalado.
      - name: Emitir certificado
        if: inputs.acao == 'certificado'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTO'
          set -euo pipefail
          dominio=new.avexa.global

          # Confere o desafio ANTES de gastar uma tentativa no Let's Encrypt:
          # errar aqui várias vezes leva a bloqueio por hora.
          mkdir -p /srv/avexa/nginx/certbot/www/.well-known/acme-challenge
          echo "avexa-motor-ok" > /srv/avexa/nginx/certbot/www/.well-known/acme-challenge/teste-avexa
          resposta=$(curl -s --max-time 15 "http://$dominio/.well-known/acme-challenge/teste-avexa" || true)
          rm -f /srv/avexa/nginx/certbot/www/.well-known/acme-challenge/teste-avexa
          if [ "$resposta" != "avexa-motor-ok" ]; then
            echo "::error::o desafio ACME não é servido em http://$dominio (veio: '$resposta')"
            exit 1
          fi
          echo "desafio ACME acessível"

          docker run --rm             -v /srv/avexa/nginx/certbot/conf:/etc/letsencrypt             -v /srv/avexa/nginx/certbot/www:/var/www/certbot             certbot/certbot certonly --webroot -w /var/www/certbot             -d "$dominio" --email dev@platty.tech             --agree-tos --no-eff-email --non-interactive

          echo "== certificados agora =="
          ls -1 /srv/avexa/nginx/certbot/conf/live/
          REMOTO

      # Instala a renovação automática do NOSSO certificado. Tudo mora em
      # /opt/avexa-motor e no crontab do usuário de deploy: nenhum arquivo de
      # sistema é criado, nada do outro produto é tocado, e a renovação é
      # escopada com --cert-name para o certificado do admin.avexa.global não
      # entrar nem por acidente. Desinstalar é apagar a linha do crontab.
      - name: Instalar a renovação automática
        if: inputs.acao == 'renovacao-automatica'
        run: |
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy \
            avexa/infra/renovar-certificado.sh \
            "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}:/opt/avexa-motor/renovar-certificado.sh"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTO'
          set -euo pipefail
          chmod 755 /opt/avexa-motor/renovar-certificado.sh

          # 17:23 é horário arbitrário de propósito: o Let's Encrypt pede que
          # não se renove em ponto. Uma linha só, idempotente.
          linha='23 17 * * * /opt/avexa-motor/renovar-certificado.sh >> /opt/avexa-motor/certificado.log 2>&1'
          atual=$(crontab -l 2>/dev/null | grep -v 'renovar-certificado.sh' || true)
          printf '%s\n%s\n' "$atual" "$linha" | sed '/^$/d' | crontab -

          echo "== crontab do usuário de deploy =="
          crontab -l

          echo
          echo "== ensaio: roda agora, sem gastar cota se ainda não vence =="
          /opt/avexa-motor/renovar-certificado.sh
          REMOTO

      # Renova agora, à mão. O cron faz o mesmo todo dia; isto é para conferir
      # que funciona sem esperar um dia.
      - name: Renovar o certificado
        if: inputs.acao == 'renovar'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTO'
          set -euo pipefail
          /opt/avexa-motor/renovar-certificado.sh
          echo "== validade agora =="
          echo | openssl s_client -connect new.avexa.global:443 -servername new.avexa.global 2>/dev/null \
            | openssl x509 -noout -dates -subject
          REMOTO

      # Instala o backup diário do Postgres. Mesmo arranjo da renovação: um
      # script em /opt/avexa-motor e uma linha no crontab do usuário de deploy.
      # Nada de sistema, nada do outro produto.
      - name: Instalar o backup automático
        if: inputs.acao == 'backup-automatico'
        run: |
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy \
            avexa/infra/backup.sh \
            "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}:/opt/avexa-motor/backup.sh"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTO'
          set -euo pipefail
          chmod 755 /opt/avexa-motor/backup.sh

          # 04h07: fora do horário em que alguém está falando com lead, e fora
          # do minuto cheio, onde todo cron do mundo se acumula.
          linha='7 4 * * * /opt/avexa-motor/backup.sh >> /opt/avexa-motor/backup.log 2>&1'
          atual=$(crontab -l 2>/dev/null | grep -v '/opt/avexa-motor/backup.sh' || true)
          printf '%s\n%s\n' "$atual" "$linha" | sed '/^$/d' | crontab -

          echo "== crontab do usuário de deploy =="
          crontab -l

          echo
          echo "== ensaio: tira um backup agora =="
          /opt/avexa-motor/backup.sh
          ls -lh /opt/avexa-motor/backups/
          REMOTO

      # Tira um backup agora, à mão.
      - name: Backup agora
        if: inputs.acao == 'backup'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTO'
          set -euo pipefail
          /opt/avexa-motor/backup.sh
          echo "== backups guardados =="
          ls -lh /opt/avexa-motor/backups/
          df -h /opt | tail -1
          REMOTO

      # Leva as credenciais dos fornecedores do cofre do GitHub para o .env do
      # servidor. Os valores nunca passam por argumento (apareceria em `ps`),
      # nunca são impressos, e o GitHub mascara qualquer secret que escape para
      # o log. Um secret não cadastrado chega vazio e é simplesmente pulado —
      # dá para configurar um fornecedor de cada vez.
      - name: Gravar segredos
        if: inputs.acao == 'segredos'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_REMETENTE: ${{ secrets.TWILIO_REMETENTE }}
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          VAPI_ASSISTANT_ID: ${{ secrets.VAPI_ASSISTANT_ID }}
          VAPI_PHONE_NUMBER_ID: ${{ secrets.VAPI_PHONE_NUMBER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CALENDLY_CLIENT_ID: ${{ secrets.CALENDLY_CLIENT_ID }}
          CALENDLY_CLIENT_SECRET: ${{ secrets.CALENDLY_CLIENT_SECRET }}
          CALENDLY_SIGNING_KEY: ${{ secrets.CALENDLY_SIGNING_KEY }}
          HUBSPOT_CLIENT_ID: ${{ secrets.HUBSPOT_CLIENT_ID }}
          HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
        run: |
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy \
            avexa/infra/segredos.sh \
            "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}:/opt/avexa-motor/segredos.sh"

          # Uma linha CHAVE=valor por vez, pela entrada padrão do ssh. O valor
          # sai daqui direto para o stdin do script remoto: não encosta em
          # linha de comando nem em arquivo intermediário.
          for chave in RESEND_API_KEY EMAIL_REMETENTE \
                       WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID \
                       TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_REMETENTE \
                       VAPI_API_KEY VAPI_ASSISTANT_ID VAPI_PHONE_NUMBER_ID \
                       GEMINI_API_KEY \
                       GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                       CALENDLY_CLIENT_ID CALENDLY_CLIENT_SECRET CALENDLY_SIGNING_KEY \
                       HUBSPOT_CLIENT_ID HUBSPOT_CLIENT_SECRET; do
            valor="${!chave}"
            if [ -n "$valor" ]; then printf '%s=%s\n' "$chave" "$valor"; fi
          done | ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy \
            "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" \
            "chmod 755 /opt/avexa-motor/segredos.sh && bash /opt/avexa-motor/segredos.sh"

          echo "== reiniciando para o novo ambiente valer =="
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy \
            "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/avexa-motor/app && docker compose --env-file .env -f infra/docker-compose.prod.yml up -d --no-deps web worker && docker compose --env-file .env -f infra/docker-compose.prod.yml ps"

      # Diz quais canais o motor enxerga. Nomes, nunca valores.
      - name: Fornecedores configurados
        if: inputs.acao == 'fornecedores'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/avexa-motor/app && docker compose --env-file .env -f infra/docker-compose.prod.yml \
             run --rm worker pnpm --filter @avexa/worker fornecedores"

      # Manda um e-mail de verdade. Chave certa com domínio não verificado passa
      # em toda checagem de presença e só falha num envio real — é esse caso que
      # este passo existe para pegar.
      - name: Testar o envio de e-mail
        if: inputs.acao == 'testar-email'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/avexa-motor/app && docker compose --env-file .env -f infra/docker-compose.prod.yml \
             run --rm worker pnpm --filter @avexa/worker e2e:email '${{ inputs.email }}'"

      # Quem está na equipe. O e-mail é a chave de entrada no painel, então
      # errar o endereço tranca a pessoa do lado de fora.
      - name: Equipe
        if: inputs.acao == 'equipe'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/avexa-motor/app && docker compose --env-file .env -f infra/docker-compose.prod.yml \
             run --rm worker pnpm --filter @avexa/worker equipe listar"

      # Corrige o e-mail de alguém da equipe. `email_atual` é o que está no
      # banco; `email` é o certo.
      - name: Trocar o e-mail de um usuário
        if: inputs.acao == 'trocar-email'
        run: |
          if [ -z "${{ inputs.email_atual }}" ]; then
            echo "::error::preencha 'email_atual' com o endereço que está no banco hoje"
            exit 1
          fi
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/avexa-motor/app && docker compose --env-file .env -f infra/docker-compose.prod.yml \
             run --rm worker pnpm --filter @avexa/worker equipe email \
             '${{ inputs.email_atual }}' '${{ inputs.email }}'"

          echo "== equipe depois da troca =="
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/avexa-motor/app && docker compose --env-file .env -f infra/docker-compose.prod.yml \
             run --rm worker pnpm --filter @avexa/worker equipe listar"

      # Tira alguém do painel. Quem já agiu é desativado em vez de apagado: a
      # trilha de auditoria é o que prova que a separação de papéis foi
      # cumprida, e apagar o usuário a transforma em "alguém fez isso".
      - name: Remover um usuário
        if: inputs.acao == 'remover-usuario'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/avexa-motor/app && docker compose --env-file .env -f infra/docker-compose.prod.yml \
             run --rm worker pnpm --filter @avexa/worker equipe remover '${{ inputs.email }}'"

          echo "== equipe agora =="
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/avexa-motor/app && docker compose --env-file .env -f infra/docker-compose.prod.yml \
             run --rm worker pnpm --filter @avexa/worker equipe listar"

      # Link mágico de entrada no painel. Enquanto o Resend não estiver
      # configurado, é assim que se entra: o link não tem como sair por e-mail.
      - name: Link de acesso
        if: inputs.acao == 'acesso'
        run: |
          # O script roda no worker, não no painel: a imagem do worker é a única
          # do deploy com dependências instaladas, e o pnpm liga os pacotes do
          # workspace dentro de apps/worker/node_modules — de apps/web nada
          # resolveria. A emissão em si é a mesma do painel (@avexa/servicos).
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/avexa-motor/app && docker compose --env-file .env -f infra/docker-compose.prod.yml \
             run --rm worker pnpm --filter @avexa/worker acesso \
             '${{ inputs.email }}' https://new.avexa.global"

      # A verificação de fumaça do deploy entra um lead de verdade pelo webhook
      # — é o único jeito de provar que a reescrita do nginx e a ingestão
      # funcionam de ponta a ponta. Dado de teste não mora em produção.
      - name: Limpar os leads de verificação
        if: inputs.acao == 'limpar-verificacao'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTO'
          set -euo pipefail
          cd /opt/avexa-motor/app
          docker compose --env-file .env -f infra/docker-compose.prod.yml exec -T postgres \
            psql -U avexa -d avexa -c "select nome, email from lead where email in ('verificacao@platty.tech','tls@platty.tech')" \
                                  -c "delete from lead where email in ('verificacao@platty.tech','tls@platty.tech')" \
                                  -c "select count(*) as leads_restantes from lead"
          REMOTO

      - name: Logs
        if: inputs.acao == 'logs'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ inputs.usuario }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/avexa-motor/app && docker compose --env-file .env -f infra/docker-compose.prod.yml logs --tail 200 '${{ inputs.servico }}'"
