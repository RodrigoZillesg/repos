name: Deploy

# Manual por padrão. Deploy automático a cada push só faz sentido depois que o
# produto estiver no ar e a equipe confiar na esteira; até lá, quem decide a
# hora de subir é uma pessoa.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Rodar o seed depois de subir (só na primeira vez)'
        type: boolean
        default: false

concurrency:
  # Dois deploys ao mesmo tempo no mesmo servidor é como se quebra um banco.
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Subir para o VPS
    runs-on: ubuntu-latest
    environment: producao

    steps:
      - uses: actions/checkout@v4

      # Os testes já rodaram no CI da branch, mas um deploy é a última chance de
      # barrar algo quebrado antes de um lead real depender disso.
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: avexa/pnpm-lock.yaml
      - name: Tipos e motor
        working-directory: avexa
        run: |
          pnpm install --frozen-lockfile
          pnpm -r typecheck
          pnpm -r test

      - name: Chave de deploy
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Sem known_hosts o rsync para na pergunta de fingerprint e o job
          # trava até estourar o tempo.
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar o código
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '**/node_modules' \
            --exclude '.next' \
            --exclude '**/.next' \
            --exclude '.env' \
            avexa/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/avexa/app/"

      - name: Construir e subir
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash /opt/avexa/app/infra/deploy-remoto.sh'

      - name: Seed (primeira vez)
        if: inputs.seed
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/avexa/app && docker compose --env-file .env -f infra/docker-compose.prod.yml run --rm worker pnpm db:seed'

      - name: Conferir se subiu
        run: |
          # Certificado novo do Let's Encrypt demora alguns segundos no primeiro
          # deploy; por isso a espera antes de desistir.
          for i in $(seq 1 12); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' https://app.avexa.global/entrar || true)
            [ "$codigo" = "200" ] && { echo "painel no ar (HTTP $codigo)"; exit 0; }
            echo "tentativa $i: HTTP $codigo"
            sleep 10
          done
          echo "::error::o painel não respondeu 200 em https://app.avexa.global/entrar"
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/avexa/app && docker compose --env-file .env -f infra/docker-compose.prod.yml logs --tail 60 web caddy'
          exit 1
