name: Deploy

# Manual por padrão. Deploy automático a cada push só faz sentido depois que o
# produto estiver no ar e a equipe confiar na esteira; até lá, quem decide a
# hora de subir é uma pessoa.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Rodar o seed depois de subir (só na primeira vez)'
        type: boolean
        default: false

concurrency:
  # Dois deploys ao mesmo tempo no mesmo servidor é como se quebra um banco.
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Subir para o VPS
    runs-on: ubuntu-latest
    environment: producao

    steps:
      - uses: actions/checkout@v4

      # Os testes já rodaram no CI da branch, mas um deploy é a última chance de
      # barrar algo quebrado antes de um lead real depender disso.
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: avexa/pnpm-lock.yaml
      - name: Tipos e motor
        working-directory: avexa
        run: |
          pnpm install --frozen-lockfile
          pnpm -r typecheck
          pnpm -r test

      - name: Chave de deploy
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Sem known_hosts o rsync para na pergunta de fingerprint e o job
          # trava até estourar o tempo.
          # keyscan falha por timeout de vez em quando (o servidor demora, o
          # sshd limita conexões simultâneas). Antes isso derrubava o passo
          # inteiro por causa do `bash -e`. Tenta algumas vezes; se não vier,
          # o accept-new faz a mesma confiança-no-primeiro-uso na hora de
          # conectar, que é exatamente o que o keyscan já fazia.
          for tentativa in 1 2 3; do
            if ssh-keyscan -T 10 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "identidade do servidor registrada"
              break
            fi
            echo "keyscan falhou (tentativa $tentativa)"
            sleep 5
          done

      - name: Enviar o código
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '**/node_modules' \
            --exclude '.next' \
            --exclude '**/.next' \
            --exclude '.env' \
            avexa/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/avexa-motor/app/"

      - name: Construir e subir
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash /opt/avexa-motor/app/infra/deploy-remoto.sh'

      - name: Seed (primeira vez)
        if: inputs.seed
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/avexa-motor/app && docker compose --env-file .env -f infra/docker-compose.prod.yml run --rm worker pnpm db:seed'

      # O deploy-remoto.sh já conferiu o painel por dentro, na porta de
      # loopback. Este passo olha o domínio público, que depende de DNS e do
      # proxy da máquina — coisas que podem não ser nossas. Por isso ele AVISA
      # em vez de falhar: derrubar um deploy que subiu bem porque o proxy de
      # outra pessoa ainda não foi configurado seria ruído.
      - name: Olhar o domínio público
        continue-on-error: true
        run: |
          for i in $(seq 1 6); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' https://new.avexa.global/entrar || true)
            if [ "$codigo" = "200" ]; then
              echo "painel no ar em https://new.avexa.global (HTTP $codigo)"
              exit 0
            fi
            echo "tentativa $i: HTTP $codigo"
            sleep 10
          done
          echo "::warning::o painel subiu no servidor, mas https://new.avexa.global ainda não responde 200."
          echo "Confira o registro A de new.avexa.global e se o vhost já foi publicado (Servidor > publicar)."
          echo "Veja a seção 'Atrás de um proxy que já existe' em avexa/infra/README.md."
