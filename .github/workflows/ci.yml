name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  avexa:
    name: Avexa — tipos e motor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avexa

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: avexa/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm -r typecheck

      # O simulador roda o motor de verdade contra as cinco personas de lead, com
      # relógio virtual e sem fornecedor nenhum. Toda alteração de fluxo ou de
      # regra passa por aqui antes de chegar perto de um lead real.
      - name: Motor e simulador
        run: pnpm -r test

      # O typecheck não enxerga erro de build: as telas do painel só são
      # compiladas de verdade aqui.
      - name: Build do painel
        run: pnpm --filter @avexa/web build

  ponta-a-ponta:
    name: Avexa — lead de teste ponta a ponta
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avexa

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avexa
          POSTGRES_PASSWORD: avexa
          POSTGRES_DB: avexa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U avexa"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://avexa:avexa@localhost:5432/avexa
      # Credenciais de fachada: os e2e rodam em modo seco e os adaptadores só
      # são exercitados na leitura de webhook, que não faz chamada de rede.
      TWILIO_ACCOUNT_SID: AC_ci
      TWILIO_AUTH_TOKEN: ci
      TWILIO_REMETENTE: '+15550000000'
      APP_SECRET: chave-de-ci-com-mais-de-trinta-e-dois-caracteres

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: avexa/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed

      # Um lead atravessa o fluxo inteiro: ligação, espera na janela do fuso do
      # lead, WhatsApp, espera de 24 horas úteis, e-mail, qualificação e saída.
      - name: Lead de teste
        run: pnpm --filter @avexa/worker e2e

      # A regra que, se falhar, falha calada: opt-out num cliente bloqueia o
      # contato em outro cliente, em todos os canais.
      - name: Supressão global entre clientes
        run: pnpm --filter @avexa/worker e2e:optout

      # A promessa comercial inteira: cliente novo provisionado do zero e um lead
      # atravessando o que a ativação criou, sem ninguém tocar em DNS ou cadastro.
      - name: Ativação de cliente
        run: pnpm --filter @avexa/worker e2e:ativacao

      # Contra um Google falso: o que se verifica é o nosso lado — segredo
      # cifrado, renovação preservando o token, revogação desligando a
      # integração e o rodízio pulando quem está ocupado.
      - name: Integração Google
        run: pnpm --filter @avexa/worker e2e:google

      # Contra um Calendly falso. É o caminho que o Google não tem: o fornecedor
      # não marca, devolve link, e a reunião só passa a existir quando o webhook
      # assinado avisa que o lead escolheu o horário.
      - name: Integração Calendly
        run: pnpm --filter @avexa/worker e2e:calendly

      # O fim da linha: o lead chegando onde o cliente trabalha. O webhook é
      # servido por um servidor HTTP local de verdade, para a assinatura ser
      # conferida do outro lado como o cliente vai conferir.
      - name: Entrega ao cliente
        run: pnpm --filter @avexa/worker e2e:entrega
